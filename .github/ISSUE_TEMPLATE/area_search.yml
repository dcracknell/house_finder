name: One-off area search
description: Look at one postcode now, using the criteria you have already set.
title: "Area search: "
body:
  - type: markdown
    attributes:
      value: |
        A single look somewhere that is not in your profile.

        Everything you have already set - budget, bedrooms, must-haves,
        exclusions, the lot - is applied to this area exactly as it stands.
        Nothing here changes those criteria, and the twice-daily scheduled run
        carries on searching your usual areas as before.

        Submit this and the search starts on its own. Give it a few minutes,
        then reload the map.

        Coming from the map, everything below is already filled in for you.
  - type: input
    id: area
    attributes:
      label: Postcode or place
      description: A postcode, an outcode or a town. For example S10, Hathersage, or Bristol.
      placeholder: S10
    validations:
      required: true
  - type: input
    id: radius
    attributes:
      label: Within, in miles
      description: >-
        How far around that point to look. 0 keeps it to the area itself.
        Anything else is snapped to the nearest radius Rightmove allows.
      placeholder: "3"
      value: "3"
    validations:
      required: true
  - type: input
    id: mode
    attributes:
      label: Looking to
      description: "buy, rent, or leave it as both."
      placeholder: both
      value: both
    validations:
      required: false
  - type: input
    id: scoring
    attributes:
      label: Scoring
      description: >-
        keyword is free. ai scores each place properly against what you wrote,
        and costs a few pence, if you have set an API key.
      placeholder: keyword
      value: keyword
    validations:
      required: false
