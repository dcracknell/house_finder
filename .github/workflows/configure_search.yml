name: Configure House Search

"on":
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Number of a 'House search setup' issue"
        required: true
        type: string

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: configure-house-search
  cancel-in-progress: false

jobs:
  configure:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.issue.title, 'House search setup') ||
      contains(github.event.issue.body, '### Buy - areas to search')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_number }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Read the issue
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$ISSUE_NUMBER" ]]; then
            echo "No issue number supplied." >&2
            exit 1
          fi
          gh issue view "$ISSUE_NUMBER" --json body --jq .body > issue_body.md

      - name: Build the profile
        shell: bash
        run: house-finder profile-from-issue issue_body.md

      - name: Commit
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/profile.json

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Update search criteria from issue #$ISSUE_NUMBER"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Start a search
        id: start
        continue-on-error: true
        shell: bash
        run: gh workflow run daily_run.yml --ref "$GITHUB_REF_NAME"

      - name: Report back
        if: success()
        shell: bash
        env:
          CHANGED: ${{ steps.commit.outputs.changed }}
          STARTED: ${{ steps.start.outcome }}
        run: |
          set -euo pipefail
          if [[ "$CHANGED" == "true" ]]; then
            message="Updated your search criteria in \`config/profile.json\`."
          else
            message="Read the form, but nothing changed in \`config/profile.json\`."
          fi
          if [[ "$STARTED" == "success" ]]; then
            message="$message A search has been started - results will appear in the Actions tab shortly."
          else
            message="$message Start the 'Daily House Search' workflow from the Actions tab to search now."
          fi
          gh issue comment "$ISSUE_NUMBER" --body "$message"
          gh issue close "$ISSUE_NUMBER" --reason completed

      - name: Report a failure
        if: failure()
        shell: bash
        run: |
          gh issue comment "$ISSUE_NUMBER" --body \
            "Could not read that form - check the Configure House Search workflow logs for what went wrong."
