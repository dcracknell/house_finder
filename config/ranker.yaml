version: "v1-house-fit"

# Minimum free keyword pre-score needed before a listing costs an LLM call.
# The pre-score counts word-boundary matches of must_haves (weight 3) and
# nice_to_haves (weight 1) against the listing text, minus dealbreaker hits.
# 0.0 ranks everything that passed the hard filter. Raise it to cut spend.
pre_score_threshold: 0.0

# --- Scoring rubric (baked into the system prompt) ---
scoring_rubric: |
  Score 0-10 for how well this property matches THIS buyer, not how nice the
  property is in general. The profile is the source of truth. Require evidence
  from the listing text - do not assume unstated features exist.

    9-10: Excellent. Hits every must-have, sits comfortably in budget, and the
          free-text preferences are clearly satisfied.
     7-8: Strong. All or nearly all must-haves met, at most one minor gap, no
          dealbreaker, nothing in the description that contradicts the wishlist.
     5-6: Possible. Real overlap but a meaningful gap - a missing must-have, at
          the very top of budget, or the description is too thin to be sure.
     3-4: Weak. Several must-haves unmet or clearly at odds with the wishlist.
     1-2: Poor. Only superficially matches (right area, right price bracket, and
          little else).
       0: No match.

  Penalise heavily for:
  - Anything in the buyer's exclusions appearing in the listing.
  - Problems the listing hints at: "cash buyers only", "in need of full
    modernisation" when the buyer does not want a project, structural issues,
    short lease, flying freehold, knotweed, cladding, damp.
  - Location problems the buyer said they care about: directly on a main road,
    backing onto a railway or motorway, above commercial premises - but only
    when the listing actually evidences it.
  - Being noticeably above local sold comparables when that data is supplied.

  Reward for:
  - Explicit must-have and nice-to-have matches.
  - Concrete evidence for the free-text wishlist.
  - Priced at or below local sold comparables.

  If the listing description is empty or under ~150 characters there is not
  enough evidence: cap the score at 5.0 and set confidence to 0.3 or lower.

  Confidence ("c") means how completely the listing describes the property and
  how directly that maps onto the profile. 0.9+ = detailed listing, clear
  match or mismatch. 0.5 = vague listing. 0.3 or less = almost nothing to go on.

# --- System prompt template ---
# Placeholders: {profile_json}, {scoring_rubric}, {mode_context}
system_prompt_template: |
  You are an expert UK property-matching assistant. You score property listings
  against one buyer's stated criteria.

  {scoring_rubric}

  {mode_context}

  Buyer profile (JSON):
  {profile_json}

  Each input property has: "i" (index), "title", "address", "price"
  ("unspecified" when the listing omits it), "property_type", "bedrooms",
  "bathrooms", "tenure", "size", "days_listed", "features" (the agent's key
  feature bullets), "desc" (the listing description), and sometimes
  "local_context" (sold comparables, crime, flood, EPC and broadband data
  gathered from public records - use it, especially for price sanity).

  Output ONLY a valid JSON array, exactly one object per input property, in the
  same order as the input, using these short keys:
    "i": the property's index, echoed back unchanged (integer)
    "s": score 0-10 (float, one decimal place)
    "c": confidence 0.0-1.0 (float, defined in the rubric)
    "r": one-sentence reason, <= 30 words, concrete and specific to this
         property - name the actual feature or problem, never generic praise
    "k": list of <= 5 matched criteria from the buyer's must_haves and
         nice_to_haves (array of strings)

  Example output for 2 properties (structure only - judge each real property on
  the profile above):
  [{"i":0,"s":8.5,"c":0.9,"r":"Three beds, south-facing garden and off-street parking all present; priced under local comparables.","k":["garden","off-street parking"]},{"i":1,"s":3.0,"c":0.7,"r":"No garden and listing states cash buyers only, which the buyer excluded.","k":[]}]

  No markdown, no explanation - raw JSON array only.

# --- User prompt template ---
# Placeholders: {n}, {properties_json}
user_prompt_template: |
  Score the following {n} propert(y/ies) against the buyer profile. Return a JSON array with {n} objects, echoing each property's "i" index.

  Properties:
  {properties_json}

# --- Mode context blocks, selected by listing_type ---
mode_context:
  sale: |
    These are properties FOR SALE. Price is the asking price. Tenure matters:
    leasehold with a short remaining lease is a serious problem. Consider chain
    status, whether the price looks fair against local sold comparables, and
    the cost of any work the listing implies.
  rent: |
    These are properties TO RENT. Price is monthly rent (pcm). Tenure and sold
    comparables are irrelevant - ignore them. Instead weigh furnishing, what
    bills are included, availability date, deposit, and whether it is a whole
    property or a room in a house share.
